{% extends "base.html" %}
{% block content %}
<div class="row-title">Upload Track</div>
{% if error %}<p style="color:#ff8a8a">{{ error }}</p>{% endif %}
<form method="POST" enctype="multipart/form-data">
  <input name="title" placeholder="Track title" required style="display:block;margin-bottom:10px;padding:8px;"><br>
  <select name="genre" style="margin-bottom:10px;padding:8px;">
    <option value="Romantic">Romantic</option><option value="HipHop">Hip-Hop</option>
    <option value="EDM">EDM</option><option value="Devotional">Devotional</option>
    <option value="Retro">Retro</option><option value="Rock">Rock</option><option value="Other">Other</option>
  </select><br>
  <input type="file" name="audio_file" accept=".mp3,.wav,.m4a" required style="margin-bottom:10px;"><br>
  <button type="submit" class="signin-btn" style="width:auto;padding:10px 20px;background:#f0c896;border:none;border-radius:8px;">Upload</button>
</form>
{% endblock %}
