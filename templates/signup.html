<!DOCTYPE html>
<html>
<head>
<title>Sign Up - Sonoria</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(900px 500px at 80% -10%, #160B24, transparent 65%), #0B0711;
  }
  .card {
    background: #140D21; border: 1px solid #2E1838; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    border-radius: 20px; padding: 40px; width: 380px; text-align: center;
  }
  .logo { font-size: 26px; font-weight: bold; color: #FBF8FF; margin-bottom: 4px; }
  .logo .accent { color: #F6DBC0; }
  .subtitle { color: #A79ABA; font-size: 18px; margin-bottom: 24px; }
  label { display:block; text-align:left; color:#A79ABA; font-size:13px; margin-bottom:4px; }
  input[type=text], input[type=password], select {
    width: 100%; padding: 10px; margin-bottom: 14px; border-radius: 10px;
    border: 1px solid #2E1838; background: #0B0711; color: #FBF8FF; outline: none;
  }
  .signin-btn {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: #F6DBC0; color: #502D55; font-weight: bold; font-size: 15px; cursor: pointer;
  }
  input:focus, select:focus { border-color: #F6DBC0; }
  .error { color: #ff8a8a; font-size: 13px; margin-bottom: 10px; }
  .footer-link { color: #A79ABA; font-size: 13px; margin-top: 16px; }
  .footer-link a { color: #F6DBC0; font-weight: bold; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Sonoria <span class="accent">•</span></div>
    <div class="subtitle">Create Your Sound</div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <label>I am a...</label>
      <select name="role">
        <option value="customer">User</option>
        <option value="artist">Artist</option>
      </select>
      <button class="signin-btn" type="submit">SIGN UP</button>
    </form>

    <div class="footer-link">Already have an account? <a href="/login">Sign In</a></div>
  </div>
</body>
</html>
